name: Uktra AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Crear proyecto
        run: |
          mkdir -p android/app/src/main/java/com/javieratoledopo/uktra
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

      - name: Copiar web
        run: |
          cp -r index.html android/app/src/main/assets/
          [ -d css ] && cp -r css android/app/src/main/assets/ || true
          [ -d js ] && cp -r js android/app/src/main/assets/ || true
          [ -d assets ] && cp -r assets android/app/src/main/assets/ || true
          [ -d images ] && cp -r images android/app/src/main/assets/ || true

      - name: settings.gradle
        run: |
          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "Uktra"' \
          'include ":app"' \
          > android/settings.gradle

      - name: build.gradle
        run: |
          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application" version "8.7.3" apply false' \
          '}' \
          > android/build.gradle

      - name: app build.gradle
        run: |
          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application"' \
          '}' \
          '' \
          'android {' \
          '    namespace "com.javieratoledopo.uktra"' \
          '    compileSdk 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId "com.javieratoledopo.uktra"' \
          '        minSdk 23' \
          '        targetSdk 35' \
          '        versionCode 1' \
          '        versionName "1.0"' \
          '    }' \
          '' \
          '    signingConfigs {' \
          '        release {' \
          '            storeFile file("${rootProject.projectDir}/upload-keystore.jks")' \
          '            storePassword System.getenv("KEYSTORE_PASSWORD")' \
          '            keyAlias System.getenv("KEY_ALIAS")' \
          '            keyPassword System.getenv("KEY_PASSWORD")' \
          '        }' \
          '    }' \
          '' \
          '    buildTypes {' \
          '        release {' \
          '            signingConfig signingConfigs.release' \
          '        }' \
          '    }' \
          '}' \
          > android/app/build.gradle

      - name: Manifest
        run: |
          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <uses-permission android:name="android.permission.INTERNET" />' \
          '    <application android:theme="@style/AppTheme" android:label="Uktra">' \
          '        <activity android:name=".MainActivity" android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '    </application>' \
          '</manifest>' \
          > android/app/src/main/AndroidManifest.xml

      - name: Styles
        run: |
          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<resources>' \
          '    <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '        <item name="android:colorAccent">#000000</item>' \
          '    </style>' \
          '</resources>' \
          > android/app/src/main/res/values/styles.xml

      - name: MainActivity
        run: |
          cat > android/app/src/main/java/com/javieratoledopo/uktra/MainActivity.java <<'EOF'
          package com.javieratoledopo.uktra;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Gradle
        run: |
          cd android
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          ./gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2

      - name: Firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore android/upload-keystore.jks \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Uktra,O=Uktra,C=CL"

      - name: AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: Uktra-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
