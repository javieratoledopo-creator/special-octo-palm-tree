}

/* --- Usuarios --- */
async function adUsers(b, scope) {
  b.innerHTML = `<div class="spin"></div>`;
  /* Para vendedores se filtra directamente en la consulta (createdBy == su uid):
     pedir la colección completa "users" suele fallar por permisos de Firestore
     para cuentas que no son admin, y eso hacía que la lista de clientes no cargara. */
  const snap = scope === "mine"
    ? await getDocs(query(collection(db, "users"), where("createdBy", "==", S.user.uid))).catch(() => null)
    : await getDocs(collection(db, "users")).catch(() => null);
  let users = snap ? snap.docs.map(d => ({ id: d.id, ...d.data() })) : [];

  /* Los vendedores solo pueden crear cuentas si el admin les asignó créditos */
  let sellerCredits = null;
  if (scope === "mine") {
    const meSnap = await getDoc(doc(db, "users", S.user.uid)).catch(() => null);
    sellerCredits = meSnap && meSnap.exists() ? (meSnap.data().credits || 0) : 0;
    if (S.account) S.account.credits = sellerCredits;
  }

  b.innerHTML = `
    ${scope === "mine" && !snap ? `<div class="err">No se pudieron cargar tus clientes (permiso denegado). Contacta al administrador.</div>` : ""}
    <div class="box"><h4>Crear cuenta de usuario</h4>
      ${scope === "mine" ? `<p class="note" style="text-align:left;margin-top:0">Créditos disponibles: <b style="color:${sellerCredits > 0 ? "#a8f0c6" : "#ffb3bd"}">${sellerCredits}</b>. Cada cuenta creada descuenta 1 crédito. ${sellerCredits <= 0 ? "Contacta al administrador para que te asigne más créditos." : ""}</p>` : ""}
      <div class="form-grid">
        <input class="inp" id="nuEmail" placeholder="Correo del cliente" />
        <input class="inp" id="nuPass" placeholder="Contraseña" />
        <input class="inp" id="nuDays" type="number" value="30" placeholder="Días de vigencia" />
        <input class="inp" id="nuNote" placeholder="Nombre o referencia" />
      </div>
      <button class="btn btn-brand" id="nuGo" style="margin-top:14px" ${scope === "mine" && sellerCredits <= 0 ? "disabled" : ""}>Crear cuenta</button>
      <p class="note" style="text-align:left">Tu sesión se mantiene activa al crear la cuenta.</p>
    </div>
    <div class="box"><h4>${scope === "mine" ? "Mis clientes" : "Usuarios"} (${users.length})</h4><div class="tbl-wrap"><table>
      <tr><th>Correo</th><th>Rol</th><th>Vence</th><th>Estado</th><th></th></tr>
      ${users.map(u => {
        const exp = u.expiresAt?.toDate ? u.expiresAt.toDate() : (u.expiresAt ? new Date(u.expiresAt) : null);
        const vig = !exp || exp > new Date();
        return `<tr><td>${esc(u.email)}${u.note ? ` <span style="color:var(--fg-dim)">· ${esc(u.note)}</span>` : ""}</td>
          <td>${u.role === "admin" ? "Administración" : u.role === "seller" ? "Vendedor" : "Usuario"}</td>
          <td>${exp ? exp.toLocaleDateString("es-MX") : "Sin límite"}</td>
          <td><span class="pill ${u.active !== false && vig ? "ok" : "no"}">${u.active === false ? "Bloqueado" : vig ? "Activo" : "Vencido"}</span></td>
          <td style="white-space:nowrap">
            <button class="btn btn-line mini" data-ren="${u.id}">+30 días</button>
            <button class="btn btn-line mini" data-edit="${u.id}">Editar</button>
            <button class="btn btn-line mini" data-creds="${u.id}">Ver clave</button>
            <button class="btn btn-line mini" data-tog="${u.id}">${u.active === false ? "Desbloquear" : "Bloquear"}</button>
          </td></tr>`;
      }).join("") || `<tr><td colspan="5">${scope === "mine" ? "Aún no tienes clientes registrados." : "Sin usuarios."}</td></tr>`}
    </table></div></div>`;
  el("nuGo").onclick = async () => {
    const email = el("nuEmail").value.trim(), pass = el("nuPass").value;
    if (!email || pass.length < 6) return toast("Correo válido y contraseña de 6+ caracteres");
    if (scope === "mine" && sellerCredits <= 0) return toast("No tienes créditos disponibles. Contacta al administrador.");
    const sellerId = S.user.uid, sellerEmail = S.user.email;
    const note = el("nuNote").value.trim();
    try {
      /* Se descuenta el crédito primero, mientras aún estamos autenticados como el vendedor */
      if (scope === "mine") await updateDoc(doc(db, "users", sellerId), { credits: increment(-1) });
      /* Se crea el usuario en una app secundaria de Firebase para no perder
         ni cambiar la sesión activa (admin o vendedor) que hizo el alta. */
      const uid = await createAuxUser(email, pass);
      const days = +el("nuDays").value || 30;
      await setDoc(doc(db, "users", uid), {
        email, pass, role: "user", active: true, note,
        createdBy: sellerId, createdByEmail: sellerEmail, createdAt: serverTimestamp(),
        expiresAt: new Date(Date.now() + days * 864e5),
        profiles: [{ id: "p1", name: (note || email.split("@")[0]).slice(0, 14), avatar: AVATARS[0] }]
      });
      await addDoc(collection(db, "sales"), { sellerId, sellerEmail, clientEmail: email, days, at: serverTimestamp() });
      toast("Cuenta creada correctamente" + (scope === "mine" ? " · 1 crédito descontado" : ""));
      el("nuEmail").value = ""; el("nuPass").value = ""; el("nuNote").value = ""; el("nuDays").value = 30;
      showCredsModal("Cuenta creada", email, pass, note);
      adUsers(b, scope);
    } catch (e) {
      /* Si falló la creación, se devuelve el crédito descontado */
      if (scope === "mine") await updateDoc(doc(db, "users", sellerId), { credits: increment(1) }).catch(() => {});
      toast(e.code === "auth/email-already-in-use" ? "Ese correo ya tiene cuenta" : "Error: " + e.message);
    }
  };
  b.querySelectorAll("[data-ren]").forEach(x => x.onclick = async () => {
    const u = users.find(z => z.id === x.dataset.ren);
    const cur = u.expiresAt?.toDate ? u.expiresAt.toDate() : new Date();
    const base = cur > new Date() ? cur : new Date();
    await updateDoc(doc(db, "users", u.id), { expiresAt: new Date(base.getTime() + 30 * 864e5), active: true });
    await addDoc(collection(db, "sales"), { sellerId: S.user.uid, sellerEmail: S.user.email, clientEmail: u.email, days: 30, renewal: true, at: serverTimestamp() });
    toast("Renovado 30 días"); adUsers(b, scope);
  });
  b.querySelectorAll("[data-tog]").forEach(x => x.onclick = async () => {
    const u = users.find(z => z.id === x.dataset.tog);
    await updateDoc(doc(db, "users", u.id), { active: u.active === false });
    adUsers(b, scope);
  });
  b.querySelectorAll("[data-edit]").forEach(x => x.onclick = () => {
    const u = users.find(z => z.id === x.dataset.edit);
    editUserModal(u, () => adUsers(b, scope));
  });
  b.querySelectorAll("[data-creds]").forEach(x => x.onclick = () => {
    const u = users.find(z => z.id === x.dataset.creds);
    if (!u.pass) return toast("Esta cuenta se creó antes de guardar contraseñas; usa Editar para restablecerla por correo.");
    showCredsModal("Credenciales", u.email, u.pass, u.note);
  });
}

  b.innerHTML = `<div class="box"><h4>Crear vendedor</h4>
    <div class="form-grid">
      <input class="inp" id="svEmail" placeholder="Correo del vendedor" />
      <input class="inp" id="svPass" placeholder="Contraseña" />
      <input class="inp" id="svName" placeholder="Nombre del vendedor" />
      <input class="inp" id="svCredits" type="number" min="0" value="0" placeholder="Créditos iniciales" />
    </div>
    <button class="btn btn-brand" id="svGo" style="margin-top:14px">Crear vendedor</button>
    <p class="note" style="text-align:left">Cada crédito permite crear 1 cuenta de cliente. Al crearse una cuenta, se descuenta 1 crédito al vendedor. Tu sesión de administrador se mantiene activa.</p></div>
  <div class="box"><h4>Vendedores (${sellers.length})</h4><div class="tbl-wrap"><table>
    <tr><th>Correo</th><th>Nombre</th><th>Créditos</th><th>Estado</th><th></th></tr>
    ${sellers.map(s => `<tr><td>${esc(s.email)}</td><td>${esc(s.note || "-")}</td>
      <td><b>${s.credits || 0}</b></td>
      <td><span class="pill ${s.active === false ? "no" : "ok"}">${s.active === false ? "Bloqueado" : "Activo"}</span></td>
      <td style="white-space:nowrap">
        <input class="inp mini" style="width:70px;display:inline-block" type="number" min="1" value="10" data-credamt="${s.id}" />
        <button class="btn btn-line mini" data-addcred="${s.id}">Agregar créditos</button>
        <button class="btn btn-line mini" data-editsel="${s.id}">Editar</button>
        <button class="btn btn-line mini" data-credsel="${s.id}">Ver clave</button>
        <button class="btn btn-line mini" data-tsel="${s.id}">${s.active === false ? "Desbloquear" : "Bloquear"}</button>
      </td></tr>`).join("")
      || `<tr><td colspan="5">Sin vendedores.</td></tr>`}
  </table></div></div>`;
  el("svGo").onclick = async () => {
    const email = el("svEmail").value.trim(), pass = el("svPass").value;
    if (!email || pass.length < 6) return toast("Correo válido y contraseña de 6+ caracteres");
    const credits = Math.max(0, +el("svCredits").value || 0);
    const note = el("svName").value.trim();
    const go = el("svGo"); go.disabled = true; const prevLabel = go.textContent; go.textContent = "Creando...";
    try {
      /* Se crea el usuario en una app secundaria de Firebase para no perder
         ni cambiar la sesión de administrador que está activa ahora mismo. */
      const uid = await createAuxUser(email, pass);
      await setDoc(doc(db, "users", uid), {
        email, pass, role: "seller", active: true, note, credits,
        createdBy: S.user.uid, createdAt: serverTimestamp(), expiresAt: null,
        profiles: [{ id: "p1", name: "Ventas", avatar: AVATARS[1] }]
      });
      toast("Vendedor creado");
      el("svEmail").value = ""; el("svPass").value = ""; el("svName").value = ""; el("svCredits").value = 0;
      showCredsModal("Vendedor creado", email, pass, note);
      adSellers(b);
    } catch (e) {
      toast(e.code === "auth/email-already-in-use" ? "Ese correo ya existe" : "Error: " + e.message);
    } finally {
      go.disabled = false; go.textContent = prevLabel;
    }
  };
  b.querySelectorAll("[data-tsel]").forEach(x => x.onclick = async () => {
    const s = sellers.find(z => z.id === x.dataset.tsel);
    await updateDoc(doc(db, "users", s.id), { active: s.active === false }); adSellers(b);
  });
  b.querySelectorAll("[data-addcred]").forEach(x => x.onclick = async () => {
    const id = x.dataset.addcred;
    const amt = Math.max(1, +b.querySelector(`[data-credamt="${id}"]`).value || 0);
    await updateDoc(doc(db, "users", id), { credits: increment(amt) });
    toast(`Se agregaron ${amt} créditos`); adSellers(b);
  });
  b.querySelectorAll("[data-editsel]").forEach(x => x.onclick = () => {
    const s = sellers.find(z => z.id === x.dataset.editsel);
    editUserModal(s, () => adSellers(b));
  });
  b.querySelectorAll("[data-credsel]").forEach(x => x.onclick = () => {
    const s = sellers.find(z => z.id === x.dataset.credsel);
    if (!s.pass) return toast("Este vendedor se creó antes de guardar contraseñas; usa Editar para restablecerla por correo.");
    showCredsModal("Credenciales", s.email, s.pass, s.note);
  });
}

/* --- Configuración --- */
function adConfig(b) {
  const on = S.settings.heroEnabled !== false;
  b.innerHTML = `<div class="box"><h4>Hero Slider</h4>
      <button class="switch ${on ? "on" : ""}" id="cfHero"><i></i> Mostrar Hero Slider en la pantalla de inicio</button>
      <p class="note" style="text-align:left">Los títulos marcados como <b>Destacado</b> en Contenido aparecen en el slider y rotan cada 6 segundos.</p></div>
    <div class="box"><h4>Identidad visual</h4>
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
        <img src="${LOGO}" style="width:180px" alt="Logo" />
        <img src="${BANNER}" style="width:280px;border-radius:12px" alt="Banner" />
      </div></div>
    <div class="box"><h4>Credenciales de acceso</h4>
      <p class="note" style="text-align:left">Cuenta de administración: <b>${esc(ADMIN_EMAIL)}</b>. El registro público está deshabilitado: las cuentas solo se crean desde este panel o por un vendedor.</p></div>`;
  el("cfHero").onclick = async () => {
    const nv = !(S.settings.heroEnabled !== false);
    S.settings.heroEnabled = nv;
    await setDoc(doc(db, "settings", "app"), { heroEnabled: nv }, { merge: true });
    adConfig(b); toast(nv ? "Hero Slider activado" : "Hero Slider desactivado");
  };
}

/* ============================================================
   PANEL VENDEDOR
   ============================================================ */
async function renderSeller(v) {
  if (S.role !== "seller") return route("inicio");
  let tab = "clients";
  v.innerHTML = `<div class="panel"><h2 style="margin-bottom:18px">Mis clientes</h2>
    <div class="tabs" id="seTabs">
      <button data-t="clients" class="on">Clientes</button>
      <button data-t="sales">Ventas</button>
    </div><div id="seBody"></div></div>`;
  const paint = () => {
    v.querySelectorAll("#seTabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
    tab === "clients" ? adUsers(el("seBody"), "mine") : sellerSales(el("seBody"));
  };
  v.querySelectorAll("#seTabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; paint(); });
  paint();
}
async function sellerSales(b) {
  b.innerHTML = `<div class="spin"></div>`;
  const snap = await getDocs(query(collection(db, "sales"), where("sellerId", "==", S.user.uid))).catch(() => null);
  const sales = snap ? snap.docs.map(d => d.data()) : [];
  const month = sales.filter(s => s.at?.toDate && s.at.toDate() > new Date(Date.now() - 30 * 864e5));
  b.innerHTML = `<div class="stats">
      <div class="stat"><div class="n">${sales.length}</div><div class="l">Ventas totales</div></div>
      <div class="stat"><div class="n">${month.length}</div><div class="l">Últimos 30 días</div></div>
      <div class="stat"><div class="n">${sales.filter(s => s.renewal).length}</div><div class="l">Renovaciones</div></div>
    </div>
    <div class="box"><h4>Historial</h4><div class="tbl-wrap"><table>
      <tr><th>Cliente</th><th>Tipo</th><th>Días</th><th>Fecha</th></tr>
      ${sales.sort((a, c) => (c.at?.seconds || 0) - (a.at?.seconds || 0)).map(s => `<tr>
        <td>${esc(s.clientEmail)}</td><td>${s.renewal ? "Renovación" : "Alta nueva"}</td><td>${s.days || 30}</td>
        <td>${s.at?.toDate ? s.at.toDate().toLocaleDateString("es-MX") : "-"}</td></tr>`).join("")
        || `<tr><td colspan="4">Sin ventas registradas.</td></tr>`}
    </table></div></div>`;
}

/* ============================================================
   PWA — manifest + service worker embebidos (sin archivos extra)
   ============================================================ */
(function pwa() {
  const manifest = {
    name: "Ultra TV", short_name: "Ultra TV", start_url: ".", display: "standalone",
    orientation: "any", background_color: "#07070b", theme_color: "#07070b",
    description: "Películas y series en Ultra TV.",
    icons: [{ src: LOGO, sizes: "512x512", type: "image/png", purpose: "any maskable" },
            { src: LOGO, sizes: "192x192", type: "image/png" }]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  document.head.appendChild(link);
})();

window.addEventListener("error", e => console.warn("UltraTV:", e.message));
</script>
